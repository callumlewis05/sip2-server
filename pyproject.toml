[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-sip2"
version = "0.1.0"
description = "SIP2 sidecar for CDS-ILS / InvenioILS, built on invenio-sip2"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "CERN Document Server team" }]
# Loose ranges here; the exact, reproducible set lives in requirements.txt.
dependencies = [
  "invenio-sip2>=1.0.0,<2",
  "invenio-base>=1.2.5,<3",
  "invenio-app>=1.3.4,<3",
  "redis>=4.5",
  "requests>=2.31",
  # Never connects to Postgres. invenio-accounts' CLI imports psycopg2 at
  # load time, which crashes every `invenio` command without it.
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
tests = [
  "pytest>=7",
  "pytest-cov",
  "pytest-timeout",
  "responses>=0.23",
  "fakeredis>=2.20",
]
dev = ["pip-tools", "black", "isort"]

# invenio-config loads this module into app.config before extensions start,
# so our SIP2_* values win over invenio-sip2's setdefault() defaults.
[project.entry-points."invenio_config.module"]
cds_sip2 = "cds_sip2.config"

# The `invenio` CLI builds the UI app; `invenio selfcheck start` runs inside
# its app context, so this is the entry point that matters (not api_apps).
[project.entry-points."invenio_base.apps"]
cds_sip2 = "cds_sip2.ext:CDSSip2"

[tool.setuptools.packages.find]
include = ["cds_sip2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 120
markers = [
  "integration: spawns the real socket server; needs Redis (SIP2_TEST_REDIS_URL)",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["cds_sip2"]