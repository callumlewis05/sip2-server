[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-sip2"
version = "0.2.0"
description = "SIP2 server for CDS-ILS / InvenioILS"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "CERN Document Server team" }]
# Loose ranges here; the exact, reproducible set lives in requirements.txt.
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
tests = [
  "pytest>=7",
  "pytest-cov",
  "pytest-timeout",
  # tests/fake_ils.py only; never installed in the image.
  "flask>=3",
]
dev = ["pip-tools", "black", "isort"]

[project.scripts]
cds-sip2 = "cds_sip2.__main__:main"

[tool.setuptools.packages.find]
include = ["cds_sip2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 120
markers = [
  "integration: spawns the real server as a subprocess against the fake ILS",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["cds_sip2"]
