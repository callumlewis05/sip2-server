# Local development stack: fake ILS + the SIP2 server (plaintext, no stunnel).
#
#   docker compose up --build
#   python -m tests.sip2_client --port 3004 --terminal kiosk1 --password secret \
#       --patron P001 --item CM-B000456412 --status-update shelf-1
#
services:
  fake-ils:
    # The fake needs Flask, which the server image deliberately does not ship.
    image: python:3.14-slim-bookworm
    command: ["sh", "-c", "pip install -q flask && python -m tests.fake_ils --host 0.0.0.0 --port 5001"]
    working_dir: /app
    volumes:
      - .:/app:ro
    ports: ["5001:5001"]

  sip2:
    build: .
    depends_on: [fake-ils]
    environment:
      CDS_SIP2_BIND_HOST: 0.0.0.0       # only for local use; the pod binds 127.0.0.1
      CDS_SIP2_ILS_URL: http://fake-ils:5001/api/sip2
      CDS_SIP2_ILS_TOKEN: test-token
      CDS_SIP2_TERMINALS: '{"kiosk1": {"password": "secret", "user_pid": "42"}}'
      CDS_SIP2_LOG_HASH_KEY: dev
    ports: ["3004:3004", "8080:8080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/entrypoint.sh", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
