name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason"
        required: false
        default: "Manual trigger"

jobs:
  Lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install black and isort
        run: pip install black isort

      - name: Check formatting (black)
        run: black --check --diff cds_sip2 tests

      - name: Check import order (isort)
        run: isort --check-only --diff cds_sip2 tests

  Python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      EXTRAS: tests
      SIP2_TEST_REDIS_URL: redis://localhost:6379/9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # editable install registers the entry points
          pip install -e ".[$EXTRAS]"
          pip freeze

      - name: Run unit tests
        run: pytest tests/unit --cov=cds_sip2 --cov-report=term-missing

      - name: Run integration tests (real socket server + Redis + fake ILS)
        run: pytest tests/integration -m integration -s

  Docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cds-sip2:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm cds-sip2:ci python -c "import cds_sip2, invenio_sip2; print(cds_sip2.__version__)"
          docker run --rm cds-sip2:ci invenio selfcheck --help